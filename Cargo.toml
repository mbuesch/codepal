[package]
name = "codepal"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = [ "derive" ] }
regex = "1"
rmcp = { version = "3", features = [ "transport-io" ] }
rusqlite = "0.40"
schemars = "1"
serde = { version = "1", features = [ "derive" ] }
tokio = { version = "1", features = [ "rt-multi-thread", "macros", "fs" ] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "limited"
panic = "abort"

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
overflow-checks = true
