[package]
name = "codepal"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = [ "derive" ] }
regex = "1"
rmcp = { version = "1", features = [ "transport-io" ] }
schemars = "1"
serde = { version = "1", features = [ "derive" ] }
tokio = { version = "1", features = [ "rt-multi-thread", "macros", "fs" ] }

[dev-dependencies]
tempfile = "3"
